services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rise
      POSTGRES_USER: rise_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - rise_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rise_app -d rise"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  rise_postgres_data: